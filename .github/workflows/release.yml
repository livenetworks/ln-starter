name: Release

# Triggered by a tag, never by a push to a branch. Tagging is a human act, so
# nothing here can publish on its own.
#
# workflow_dispatch runs the identical pipeline as a dry run: every gate
# executes, the archive and checksum are produced and uploaded, and only the
# GitHub Release step is skipped. That is the whole point of it — the
# publication path is proven without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, e.g. v2.0.0'
        required: true
        type: string

# Least privilege by default. Only the publish job widens this, and only to
# contents: write, which is what creating a release needs.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ gate 1
  # The same qualification the branch gets. A tag does not exempt anything:
  # tests.yml runs on push, but a tag may point at a commit whose branch run
  # predates a force-push, so it is re-run here against the tagged tree.
  qualify:
    name: L${{ matrix.framework.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          - laravel: '12'
            testbench: '^10.11'
          - laravel: '13'
            testbench: '^11.2'
        php: ['8.3', '8.4', '8.5']
        database: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ln_starter_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ln_starter_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=postgres --dbname=ln_starter_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ln_starter_ci
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      LN_STARTER_ALLOW_TEST_DB_RESET: '1'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl
          coverage: none

      - name: Pin Testbench for Laravel ${{ matrix.framework.laravel }}
        run: composer require --dev "orchestra/testbench:${{ matrix.framework.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      # Only supported lanes release. There is no EOL exemption here, because
      # nothing end-of-life is being published.
      - name: Composer audit
        run: composer audit --locked

      - name: Run test suite
        run: vendor/bin/phpunit --display-skipped

      # A skipped race test is indistinguishable from a passing one in the
      # summary. On a release lane it MUST execute.
      - name: Assert the row-lock race test actually ran
        run: |
          php -r 'exit(function_exists("pcntl_fork") ? 0 : 1);' \
            || { echo "::error::pcntl is unavailable; the race test cannot run"; exit 1; }
          vendor/bin/phpunit \
            --filter test_concurrent_link_and_code_consumption_has_exactly_one_winner \
            --fail-on-skipped \
            --testdox

  # ------------------------------------------------------------------ gate 2
  # Builds THE artifact. Exactly one archive is produced here and everything
  # downstream consumes this build — a rebuild would be a different artifact
  # (ADR 0004).
  artifact:
    name: Build and qualify the release artifact
    runs-on: ubuntu-latest
    needs: qualify

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, zip
          coverage: none

      - name: Resolve the version under release
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version under release: $VERSION"

      # Fail-closed preflight: SemVer, tag/HEAD agreement, release notes,
      # changelog section, manifest, source hygiene, archive contents,
      # installability and checksum. It refuses a dirty tree outright.
      - name: Release preflight
        run: php scripts/release-check.php --version=${{ steps.version.outputs.version }}

      # Rebuilt here only to hand the exact files downstream; release-check
      # above has already refused the build if anything was wrong with it.
      - name: Stage the archive and checksum
        id: stage
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          php scripts/verify-artifact.php \
            --keep-extracted \
            --output-path-file="$RUNNER_TEMP/release/extracted-path.txt" \
            --output-archive-file="$RUNNER_TEMP/release/archive-path.txt"

          ARCHIVE="$(cat "$RUNNER_TEMP/release/archive-path.txt")"
          EXTRACTED="$(cat "$RUNNER_TEMP/release/extracted-path.txt")"
          test -f "$ARCHIVE" || { echo "::error::archive not found"; exit 1; }
          test -d "$EXTRACTED" || { echo "::error::extracted package not found"; exit 1; }

          cp "$ARCHIVE" "$RUNNER_TEMP/release/"
          NAME="$(basename "$ARCHIVE")"
          ( cd "$RUNNER_TEMP/release" && sha256sum "$NAME" > "$NAME.sha256" )

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Archive: $NAME"
          cat "$RUNNER_TEMP/release/$NAME.sha256"

      - name: Upload the archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------ gate 3
  # Installs a consumer from the uploaded archive. This is the step that proves
  # what will be published actually boots as a Laravel package, and it runs
  # against the same bytes that were checksummed.
  consumer:
    name: Consumer L${{ matrix.laravel }} from the release archive
    runs-on: ubuntu-latest
    needs: artifact

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: package

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, pdo_sqlite
          coverage: none

      - name: Download the release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive
          path: ${{ runner.temp }}/release

      - name: Verify the checksum before using the archive
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256
          echo "Checksum verified; this is the archive the artifact job qualified."

      - name: Install a consumer from the archive
        run: |
          cd "$RUNNER_TEMP/release"
          ARCHIVE="$(ls ./*.zip)"
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          test -f extracted/composer.json || { echo "::error::archive has no composer.json at its root"; exit 1; }
          php "$GITHUB_WORKSPACE/package/scripts/consumer-install.php" \
            --laravel=${{ matrix.laravel }} \
            --package-path="$RUNNER_TEMP/release/extracted"

  # ------------------------------------------------------------------ publish
  # Only for a real tag, and only after every gate above is green. A dry run
  # reaches this job's condition and stops, which is exactly what makes the
  # rehearsal meaningful: everything before this point already ran.
  publish:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: [qualify, artifact, consumer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the qualified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive
          path: ${{ runner.temp }}/release

      - name: Re-verify the checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256

      - name: Require release notes for this tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          test -f "docs/releases/$VERSION.md" \
            || { echo "::error::docs/releases/$VERSION.md is missing"; exit 1; }
          echo "notes=docs/releases/$VERSION.md" >> "$GITHUB_ENV"

      # gh is preinstalled on the runner, so no third-party action and no
      # additional token. GITHUB_TOKEN is scoped to contents: write on this job
      # alone. Packagist is not published from here and holds no secret in this
      # repository; it publishes from the tag itself.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --verify-tag \
            "$RUNNER_TEMP"/release/*.zip \
            "$RUNNER_TEMP"/release/*.sha256
