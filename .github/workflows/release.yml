name: Release

# Triggered by a tag, never by a push to a branch. Tagging is a human act, so
# nothing here can publish on its own.
#
# workflow_dispatch runs the identical pipeline as a dry run: every gate
# executes, the archive and checksum are produced and uploaded, and only the
# GitHub Release step is skipped. That is the whole point of it — the
# publication path is proven without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, e.g. v2.0.0'
        required: true
        type: string

# Least privilege by default. Only the publish job widens this, and only to
# contents: write, which is what creating a release needs.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ gate 1
  # The full branch qualification, called rather than copied: 24 test lanes,
  # the artifact job and both consumer jobs. A reduced release matrix would
  # let a tag be published on weaker evidence than the branch it came from,
  # and `publish` needs this job, so a red Tests run blocks the release.
  qualify:
    name: Full qualification
    uses: ./.github/workflows/tests.yml

  # ------------------------------------------------------------------ gate 2
  # Builds THE artifact, exactly once. release-check.php performs the build,
  # inspects it, checksums it and exports those bytes; nothing here rebuilds,
  # because a second `composer archive` is a different artifact however
  # identical it looks (ADR 0004).
  artifact:
    name: Qualify and export the release artifact
    runs-on: ubuntu-latest
    needs: qualify

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # release-check.php inspects tags; a shallow clone has none.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, zip
          coverage: none

      # The version reaches the shell through the environment, never through
      # template interpolation: a tag may legally be named `v1.0.0$(id)`, and
      # `${{ }}` would paste that straight into the script before anything had
      # a chance to validate it. Validated here as well as in the preflight,
      # because this step is what writes it to $GITHUB_OUTPUT.
      - name: Resolve the version under release
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$INPUT_VERSION"
          fi

          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Refusing a non-canonical version"
            exit 1
          }

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version under release: $VERSION"

      # Fail-closed preflight: canonical SemVer, clean tree, annotated tag on
      # HEAD, finalised release notes, changelog section, manifest, source
      # hygiene, then the archive — built, inspected, installed, checksummed
      # and exported to --output-dir. Those exported bytes are the release.
      - name: Release preflight and artifact export
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          php scripts/release-check.php \
            --version="$VERSION" \
            --output-dir="$RUNNER_TEMP/release"

          ls -l "$RUNNER_TEMP/release"
          ( cd "$RUNNER_TEMP/release" && sha256sum --check ./*.sha256 )

      - name: Upload the qualified archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------ gate 3
  # Fresh install AND upgrade, both driven from the canonical archive. The
  # branch qualification already runs these against the working tree; what is
  # proven here is that the bytes about to be published behave the same.
  consumer:
    name: Consumer L${{ matrix.laravel }} from the release archive
    runs-on: ubuntu-latest
    needs: artifact

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: package

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, pdo_sqlite
          coverage: none

      - name: Download the qualified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive
          path: ${{ runner.temp }}/release

      - name: Verify the checksum and extract
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256
          ARCHIVE="$(ls ./*.zip)"
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          test -f extracted/composer.json || {
            echo "::error::archive has no composer.json at its root"
            exit 1
          }
          echo "Checksum verified; installing from the archive the artifact job qualified."

      - name: Fresh install from the archive
        run: |
          php "$GITHUB_WORKSPACE/package/scripts/consumer-install.php" \
            --laravel=${{ matrix.laravel }} \
            --package-path="$RUNNER_TEMP/release/extracted"

      - name: Upgrade from a simulated auth v1 installation, using the archive
        run: |
          php "$GITHUB_WORKSPACE/package/scripts/consumer-upgrade.php" \
            --laravel=${{ matrix.laravel }} \
            --package-path="$RUNNER_TEMP/release/extracted"

  # ------------------------------------------------------------------ publish
  # Only for a real tag, and only after every gate above is green — including
  # the full branch qualification, which `qualify` runs and this job needs. A
  # dry run reaches this job's condition and stops, which is what makes the
  # rehearsal meaningful: everything before this point already ran.
  publish:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: [qualify, artifact, consumer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the qualified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive
          path: ${{ runner.temp }}/release

      - name: Re-verify the checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256

      # gh is preinstalled on the runner, so no third-party action and no
      # additional token. GITHUB_TOKEN is scoped to contents: write on this job
      # alone. Packagist publishes from the tag and holds no secret here.
      #
      # Every value reaching the shell comes through the environment. --verify-tag
      # makes gh refuse a tag that does not exist on the remote.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Refusing a non-canonical tag"
            exit 1
          }

          NOTES="docs/releases/${VERSION#v}.md"
          test -f "$NOTES" || {
            echo "::error::$NOTES is missing"
            exit 1
          }

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES" \
            --verify-tag \
            "$RUNNER_TEMP"/release/*.zip \
            "$RUNNER_TEMP"/release/*.sha256
