name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: L${{ matrix.framework.laravel }} ${{ matrix.framework.support }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          # Laravel 11 is an END-OF-LIFE compatibility lane. It exists so the
          # package keeps installing for consumers who have not upgraded yet.
          # A green L11 lane is NOT evidence that Laravel 11 is security-
          # supported, and it must never be cited as a production target.
          - laravel: '11'
            testbench: '^9.17'
            support: 'EOL-compat'
          - laravel: '12'
            testbench: '^10.11'
            support: 'supported'
          - laravel: '13'
            testbench: '^11.2'
            support: 'supported'
        php: ['8.3', '8.4', '8.5']
        # PostgreSQL is the stack's documented primary database, so it gets a
        # first-class lane; the row-lock race test only runs on mysql/pgsql.
        database: [sqlite, mysql, pgsql]

        exclude:
          # Laravel 11 requires php ^8.2, so 8.5 satisfies the constraint on
          # paper. But 11.x reached end of life before PHP 8.5 shipped, so it
          # will never receive a compatibility fix for it. Keeping this lane
          # would mean a permanently red job that says nothing about the
          # package. Supported lanes (12, 13) still cover 8.5.
          - framework:
              laravel: '11'
              testbench: '^9.17'
              support: 'EOL-compat'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ln_starter_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ln_starter_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=postgres --dbname=ln_starter_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database == 'sqlite' && 'testing' || matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ln_starter_ci
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      # The suite drops all tables between test classes on server-backed
      # connections. That is opt-in and allow-listed by name, so it can only
      # ever reach a disposable CI database. See tests/TestDatabaseGuard.php.
      LN_STARTER_ALLOW_TEST_DB_RESET: '1'
      # Laravel 11 is an EOL compatibility lane. Its final upstream release is
      # advisory-blocked, so resolution needs security blocking disabled. This
      # applies ONLY to the EOL lane and never to a supported production lane;
      # the supported lanes additionally run `composer audit` below.
      COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.framework.laravel == '11' && '1' || '0' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl
          coverage: none

      - name: Pin Testbench for Laravel ${{ matrix.framework.laravel }}
        run: composer require --dev "orchestra/testbench:${{ matrix.framework.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Report lane
        run: |
          echo "Laravel ${{ matrix.framework.laravel }} (${{ matrix.framework.support }})"
          echo "PHP ${{ matrix.php }}"
          echo "Database lane: ${{ matrix.database }} (DB_CONNECTION=$DB_CONNECTION)"

      # Supported production lanes must be advisory-clean. The EOL lane is
      # excluded on purpose: it is a compatibility check, not a security claim.
      - name: Composer audit (supported lanes only)
        if: matrix.framework.laravel != '11'
        run: composer audit --locked

      - name: Run test suite
        run: vendor/bin/phpunit --display-skipped

      # A skipped race test is indistinguishable from a passing one in the
      # summary, so the row-locking contract is asserted explicitly. On a
      # server-backed lane this test MUST execute; --fail-on-skipped turns a
      # silent skip into a red lane.
      - name: Assert the row-lock race test actually ran
        if: matrix.database != 'sqlite'
        run: |
          echo "Race test on ${{ matrix.database }} (Laravel ${{ matrix.framework.laravel }} / PHP ${{ matrix.php }})"
          php -r 'exit(function_exists("pcntl_fork") ? 0 : 1);' \
            || { echo "::error::pcntl is unavailable; the race test cannot run"; exit 1; }
          vendor/bin/phpunit \
            --filter test_concurrent_link_and_code_consumption_has_exactly_one_winner \
            --fail-on-skipped \
            --testdox
          echo "Race test executed on ${{ matrix.database }}: not skipped."

  artifact:
    name: Release artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Proves the published package is installable and free of local
      # artefacts, rather than only proving the working tree is.
      - name: Inspect the distributable artifact
        run: php scripts/verify-artifact.php   # no --allow-offline: installability is a gate

  consumer:
    name: Consumer L${{ matrix.laravel }} install + upgrade
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supported production lanes only; the EOL lane is a compatibility
        # check, not an installation guarantee.
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: package

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Fresh consumer installation (working tree)
        run: php package/scripts/consumer-install.php --laravel=${{ matrix.laravel }}

      - name: Upgrade from a simulated auth v1 installation
        run: php package/scripts/consumer-upgrade.php --laravel=${{ matrix.laravel }}

      # Autoloading from the archive is not package discovery. Installing the
      # extracted artifact into a real skeleton is what proves the published
      # package boots as a Laravel package.
      - name: Fresh consumer installation (published artifact)
        run: |
          php package/scripts/verify-artifact.php --keep-extracted --output-path-file="$RUNNER_TEMP/artifact-path.txt"
          EXTRACTED="$(cat "$RUNNER_TEMP/artifact-path.txt")"
          test -d "$EXTRACTED" || { echo "::error::extracted artifact not found"; exit 1; }
          echo "Installing consumer from artifact at $EXTRACTED"
          php package/scripts/consumer-install.php --laravel=${{ matrix.laravel }} --package-path="$EXTRACTED"