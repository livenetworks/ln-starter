name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.framework.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          - laravel: '11'
            testbench: '^9.17'
          - laravel: '12'
            testbench: '^10.11'
          - laravel: '13'
            testbench: '^11.2'
        php: ['8.3', '8.4', '8.5']
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ln_starter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database == 'mysql' && 'mysql' || 'testing' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ln_starter
      DB_USERNAME: root
      DB_PASSWORD: root
      # Laravel 11 is an EOL compatibility lane whose final upstream release
      # is advisory-blocked by Composer. This never changes consumer config.
      COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.framework.laravel == '11' && '1' || '0' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, pcntl
          coverage: none

      - name: Pin Testbench for Laravel ${{ matrix.framework.laravel }}
        run: composer require --dev "orchestra/testbench:${{ matrix.framework.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Run test suite
        run: composer test
